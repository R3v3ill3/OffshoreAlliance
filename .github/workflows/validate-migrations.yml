name: Validate Supabase migrations

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/validate-supabase-migrations.mjs"
      - "package.json"
  push:
    branches:
      - main
      - develop
    paths:
      - "supabase/migrations/**"
      - "scripts/validate-supabase-migrations.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm validate:migrations
