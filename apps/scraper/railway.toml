# Railway service configuration for @oa/scraper.
#
# Deploy notes:
#  - Set Root Directory to "apps/scraper" in the Railway project settings;
#    Railway will pick up this file and the Dockerfile relative to that.
#  - Required env vars (set in Railway dashboard, not committed):
#      SUPABASE_URL
#      SUPABASE_SERVICE_ROLE_KEY
#      SCRAPER_SHARED_SECRET
#      NOPSEMA_URL          (optional override of default)
#      SCRAPER_CONTACT_EMAIL
#  - Railway injects PORT automatically; the HTTP server reads it.
#  - Configure a Cron schedule in Railway Settings -> Cron Jobs:
#      Command:  node dist/cron.js
#      Schedule: 0 16 * * *      (16:00 UTC = 02:00 AEST next day)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
